name: EZ Texting website login test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - env: {EZ_USER: "${{ secrets.EZ_USER }}", EZ_PASS: "${{ secrets.EZ_PASS }}"}
        run: python scripts/web_login_test.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: shots, path: shots, retention-days: 3}
